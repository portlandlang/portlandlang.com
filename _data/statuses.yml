# How the spec dashboard draws each status.
# The statuses themselves and which file has which comes from `_data/ruby_spec.json`.
# The .json is generated in the language repo by `script/ruby_spec_dashboard`.
#
# Listed in bar order:
#   done
#   in progress
#   broken
#   not started
#   never

- key: passing
  label: Passing
  color: green
  description: Imported, and passing on both the Rust seed interpreter and the self-hosted Portland compiler

- key: partial_intentional
  label: Partial, by design
  color: green-striped
  description: Imported in part, the rest stays behind on purpose

- key: partial_planned
  label: Partial, more planned
  color: yellow
  description: Imported in part, still planned

- key: failing
  label: Failing
  color: red
  description: Imported, failing

- key: missing
  label: Missing
  color: orange
  description: Not imported, yet

- key: skipped
  label: Skipped
  color: grey
  description: Not imported, by design
