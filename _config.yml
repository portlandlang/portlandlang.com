# The vendored Bootstrap lives under assets/vendor/ and publishes with the
# rest of assets/; the root vendor/ is only ever bundler's, and stays out.
exclude:
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - script
  - vendor
